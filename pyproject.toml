[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lazulite"
version = "0.1.0"
description = "用于歌词搜索、转写证据与行级对齐的自动化引擎"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Lazulite contributors" }]
dependencies = [
    "fuzzywuzzy>=0.18,<1",
    "mutagen>=1.47",
    "numpy>=2.0",
    "opencc>=1.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
]

[project.scripts]
lazulite = "lazulite.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
