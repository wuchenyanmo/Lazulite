[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lazulite"
version = "0.3.1"
description = "独立人声准备、行级证据与日语全局词级对齐引擎"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES"]
authors = [{ name = "Lazulite contributors" }]
dependencies = [
    "rapidfuzz>=3.14.6,<4",
    "mutagen>=1.47",
    "numpy>=2.0",
    "scipy>=1.17,<2",
    "opencc>=1.1",
    "requests>=2.31",
]

[project.optional-dependencies]
japanese = [
    "torch>=2.6",
    "transformers==4.57.6",
]

whisper = [
    "torch>=2.6",
    "transformers==4.57.6",
]
qwen = [
    "qwen-asr==0.0.6",
    "torch>=2.6",
    "transformers==4.57.6",
]
forced-qwen = [
    "qwen-asr==0.0.6",
    "torch>=2.6",
    "transformers==4.57.6",
]
vocal = [
    "demucs==4.0.1",
    "scipy==1.18.1",
    "torch>=2.6",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
]

[project.scripts]
lazulite = "lazulite.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
